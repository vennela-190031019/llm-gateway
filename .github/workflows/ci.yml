name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: pip install uv

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy app

      - name: Audit dependencies for known vulnerabilities (pip-audit)
        # PYSEC-2026-1325 (the "Minerva" timing attack) is a pure-Python
        # `ecdsa` package issue, pulled in transitively by python-jose for
        # ES*-algorithm support; it only affects ECDSA signing/ECDH, and
        # this app signs JWTs with HS256 (HMAC) via settings.jwt_algorithm,
        # never touching the vulnerable code path. The ecdsa maintainers
        # have stated there's no planned fix (side-channel attacks are
        # explicitly out of scope for the project), so there's no version
        # to upgrade to — ignored here deliberately, not overlooked.
        run: pip-audit --ignore-vuln PYSEC-2026-1325

      - name: Run tests
        run: pytest --cov=app --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run lint
      - run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t llm-gateway-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t llm-gateway-frontend:ci ./frontend
