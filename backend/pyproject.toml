[project]
name = "llm-gateway"
version = "0.1.0"
description = "Production-grade LLM Gateway & Observability Platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "greenlet>=3.1.0",
    "asyncpg>=0.30.0",
    "alembic>=1.13.3",
    "redis>=5.1.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.2.0",
    "tenacity>=9.0.0",
    "httpx>=0.27.2",
    "prometheus-client>=0.21.0",
    "structlog>=24.4.0",
    "openai>=1.51.0",
    "python-multipart>=0.0.12",
    "slowapi>=0.1.9",
    "pyyaml>=6.0.2",
    "email-validator>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "aiosqlite>=0.20.0",
    "httpx2>=2.12.0",
    "fakeredis>=2.24.0",
    "pip-audit>=2.7.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
